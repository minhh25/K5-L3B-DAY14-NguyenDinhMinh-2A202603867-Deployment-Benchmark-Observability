name: Production readiness
on:
  push:
  pull_request:
jobs:
  production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 06-lab-complete/requirements.txt
      - run: pip install -r requirements.txt
      - name: Start test Redis
        run: docker run -d --name day14-test-redis -p 127.0.0.1:16379:6379 redis:7-alpine
      - name: Verify atomic shared guards
        env:
          REDIS_URL: redis://localhost:16379/0
        run: python -m unittest discover -s tests -v
      - name: Verify all 12 criteria including Docker
        run: python check_production_ready.py --redis-url redis://localhost:16379/0 | tee production-readiness.txt
      - name: Validate alert rules
        run: >-
          docker run --rm -v "$PWD/benchmark-observability/production/prometheus:/p"
          --entrypoint promtool prom/prometheus:v3.16.0 test rules /p/alert_rules_test.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness
          path: 06-lab-complete/production-readiness.txt
      - if: always()
        run: docker rm -f day14-test-redis
