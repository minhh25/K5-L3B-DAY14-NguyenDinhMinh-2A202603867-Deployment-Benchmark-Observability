name: Agent quality gate
on:
  push:
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt
      - run: pip install -r requirements.txt
      - name: Start candidate with no random upstream faults
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 PORT=8002 python app.py > /tmp/agent.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8002/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent.log
          exit 1
      - name: Require 23/23 and no regression
        run: >-
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 1.0
          --baseline ../../../reports/eval_v2_fixed.json --out reports/eval_ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
